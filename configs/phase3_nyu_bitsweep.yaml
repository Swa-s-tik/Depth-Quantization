# Aggregate-only bit sweep on NYUv2 (Sec. 11.2) over all 654 test images; boundary
# metrics are off because NYUv2 Kinect ground truth is unreliable at edges.
# Command: python run_sweep.py configs/phase3_nyu_bitsweep.yaml
#          python analyze.py results/phase3_nyu_bitsweep.csv
name: phase3_nyu_bitsweep
dataset: nyu
subset: null              # all 654 test images
models: [dav2_small, dav2_base, dav2_large]
specs:
  - {kind: fp16}
  - {kind: wq, w_bits: 8}
  - {kind: wq, w_bits: 6}
  - {kind: wq, w_bits: 4}
  - {kind: wq, w_bits: 3}
align: ss
boundary: false
seed: 0
